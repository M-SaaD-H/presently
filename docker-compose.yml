services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "3000:3000"
    networks:
      - net
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - apps/web/.env.local
    environment:
      - NODE_ENV=production
    volumes:
      - shared_output:/app/output
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    ports:
      - "3001:3001"
    networks:
      - net
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - apps/worker/.env.local
    environment:
      - NODE_ENV=production
      - WORKER_PORT=3001
      - STORAGE_TYPE=local
      - OUTPUT_DIR=/app/output
      - CHROME_EXECUTABLE=/usr/bin/chromium
    volumes:
      - shared_output:/app/output
    shm_size: '2gb'
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped

volumes:
  shared_output:

networks:
  net:
    driver: bridge
